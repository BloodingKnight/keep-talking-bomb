[package]
name = "bombgame"
version = "1.1.8"
description = "保持沟通就没人爆炸 - 本地多人合作拆弹游戏"
edition = "2021"
rust-version = "1.77"

[lib]
# 安卓需要 staticlib/cdylib；桌面用 rlib 给 main.rs 调
name = "bombgame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
