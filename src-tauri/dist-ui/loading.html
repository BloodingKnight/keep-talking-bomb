<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>BombGame 正在启动</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center;
        background: #0b0f14; color: #dce6f2;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .bomb { font-size: 44px; animation: beat 1.2s ease-in-out infinite; }
      @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      h1 { font-size: 17px; font-weight: 600; margin: 0; }
      p { margin: 0; color: #8fa3bb; font-size: 13px; }
      .bar { width: 220px; height: 4px; background: #1d2735; border-radius: 4px; overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; background: #ffb347; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
  </head>
  <body>
    <div class="bomb">💣</div>
    <h1>正在启动游戏服务…</h1>
    <div class="bar"><i></i></div>
    <p>第一次启动需要一两秒，马上就好。</p>
  </body>
</html>
