<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BombGame</title>
    <style>
      :root { color-scheme: dark; --accent: #ffb347; --line: #263141; --muted: #8fa3bb; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 28px 20px;
        display: flex; flex-direction: column; gap: 16px; justify-content: center;
        background: radial-gradient(700px 420px at 50% 0%, #16202c, #0b0f14 70%);
        color: #dce6f2; font-family: system-ui, "Microsoft YaHei", sans-serif;
      }
      .bomb { font-size: 46px; text-align: center; }
      h1 { font-size: 19px; margin: 0; text-align: center; }
      p.sub { margin: 0; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }
      label { font-size: 13px; color: var(--muted); }
      input {
        width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 15px;
        background: #0d131b; color: #dce6f2; border: 1px solid var(--line);
      }
      button {
        width: 100%; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700;
        border: 1px solid #f0a33a; background: linear-gradient(180deg, #ffc266, #f0a33a); color: #241a05;
      }
      button.ghost { background: #131c28; color: #dce6f2; border-color: var(--line); font-weight: 600; }
      .row { display: flex; flex-direction: column; gap: 10px; }
      .hint { font-size: 12px; color: var(--muted); line-height: 1.7; }
      .err { color: #ff8a80; font-size: 13px; min-height: 18px; }
      code { background: #0d131b; border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="bomb">💣</div>
    <h1>连接到房主的游戏</h1>
    <p class="sub">
      手机这边不跑服务端。请填房主电脑上游戏窗口里显示的地址，<br />
      或者房主发给你的公网链接（<code>https://…</code>）。
    </p>
    <div class="row">
      <label for="u">房主地址</label>
      <input id="u" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://xxxx.trycloudflare.com" />
      <div class="err" id="err"></div>
      <button id="go">进入游戏</button>
      <button class="ghost" id="last">打开上次的地址</button>
    </div>
    <p class="hint">
      例子：<code>http://192.168.1.7:3210</code>（同一个 Wi-Fi）<br />
      或者 <code>https://silly-cats-jump-here.trycloudflare.com</code>（异地，房主运行了 tools/share.mjs）
    </p>
    <script>
      const KEY = 'bomb-server-url';
      const input = document.getElementById('u');
      const err = document.getElementById('err');
      const lastBtn = document.getElementById('last');

      function normalize(raw) {
        let v = String(raw || '').trim();
        if (!v) return '';
        if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
        // 只允许 http/https，防止有人填个 javascript: 之类
        try {
          const u = new URL(v);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
          return u.origin + '/';
        } catch {
          return '';
        }
      }

      const saved = localStorage.getItem(KEY) || '';
      if (saved) input.value = saved;
      lastBtn.style.display = saved ? '' : 'none';

      function go(raw) {
        const url = normalize(raw);
        if (!url) {
          err.textContent = '地址看起来不对，应该像 http://192.168.1.7:3210 或 https://xxx.trycloudflare.com';
          return;
        }
        err.textContent = '';
        localStorage.setItem(KEY, url);
        location.replace(url);
      }

      document.getElementById('go').addEventListener('click', () => go(input.value));
      lastBtn.addEventListener('click', () => go(saved));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') go(input.value);
      });
    </script>
  </body>
</html>
