name: tauri-android

# 生成 Android APK：用 GitHub 的 Linux runner 编译，本机不需要 Rust/Android SDK。
# 说明：手机上跑不了 node.exe，所以这个 APK 是"瘦客户端" ——
#       打开后先填房主的地址（局域网 IP 或 tools/share.mjs 给出的公网链接），再进游戏。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # github 的 ubuntu 镜像自带 Android SDK 与 NDK；默认路径在 /usr/local/lib/android/sdk。
      # 不用 android-actions/setup-android（它在新镜像上会因为 sdkmanager 找不到 'tools' 包而失败）。
      - name: 准备 Android SDK / NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "镜像里没有 NDK，现装一个…"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "用到的 NDK: $NDK_DIR"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: 生成图标
        working-directory: src-tauri
        run: cargo tauri icon logo.png

      # 桌面版的资源（node.exe 与 server/lib/client）在 tauri.conf.json 里是 glob，
      # 安卓用不到这些（手机上跑不了 node.exe），但 Tauri 要求 glob 至少匹配到一个文件，
      # 否则直接报 "glob pattern bundle-assets/**/* path not found"。放一个占位文件即可。
      - name: 占位（避免资源 glob 匹配不到）
        run: |
          mkdir -p src-tauri/bundle-assets
          echo "android build does not bundle node.exe" > src-tauri/bundle-assets/ANDROID.txt
          ls -la src-tauri/bundle-assets

      - name: 初始化 Android 工程
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: 构建 APK（arm64，覆盖绝大多数手机）
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64

      - name: 收集 APK
        run: |
          mkdir -p out
          find src-tauri/gen/android -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BombGame-android
          path: out/*.apk
          if-no-files-found: error

      - name: 打 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: false
