name: tauri-windows

# 本机没装 Rust 也能出安装包：用 GitHub 的 Windows runner 编译（它自带 Rust + MSVC）。
# 在仓库 Actions 页面点 "Run workflow" 即可；打 tag（v*）时会自动构建并挂到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 顺带跑一下不依赖服务端的测试，防止把坏代码打进安装包
      - name: 自检（二维码 / 邀请链接）
        run: node tests/qr.mjs

      - name: 准备内置 node.exe 与游戏文件
        run: node tools/prepare-tauri-assets.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: 生成图标
        working-directory: src-tauri
        run: cargo tauri icon logo.png

      - name: 打包（NSIS 安装包 + MSI + 免安装 exe）
        working-directory: src-tauri
        run: cargo tauri build

      - name: 收集产物
        run: |
          mkdir out
          copy src-tauri\target\release\bombgame.exe out\BombGame-桌面版.exe
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination out
          Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Copy-Item -Destination out
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: BombGame-tauri-windows
          path: out/*
          if-no-files-found: error

      - name: 打 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
