name: tauri-windows

# 本机没装 Rust 也能出安装包：用 GitHub 的 Windows runner 编译（它自带 Rust + MSVC）。
# 在仓库 Actions 页面点 "Run workflow" 即可；打 tag（v*）时会自动构建并挂到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 顺带跑一下不依赖服务端的测试，防止把坏代码打进安装包
      - name: 自检（二维码 / 邀请链接）
        run: node tests/qr.mjs

      - name: 准备内置 node.exe 与游戏文件
        run: node tools/prepare-tauri-assets.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: 生成图标
        working-directory: src-tauri
        run: cargo tauri icon logo.png

      - name: 打包（NSIS 安装包 + MSI + 免安装 exe）
        working-directory: src-tauri
        run: cargo tauri build

      - name: 收集产物
        run: |
          mkdir out
          # 只发安装包：target/release/bombgame.exe 单独拿出来是跑不了的
          # （它依赖 resources 里的 node.exe 与 server/），发出去只会让人以为坏了。
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Copy-Item -Destination out
          Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Copy-Item -Destination out
          Get-ChildItem out

      # 免安装版：exe + 同目录下的 bundle-assets（node.exe 与游戏文件）。
      # 程序启动时按 exe 所在目录找资源，所以整个文件夹复制走就能用，不写注册表、不需要安装。
      - name: 打免安装（绿色）版
        run: |
          $ver = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = "out\portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri\target\release\bombgame.exe "$dir\BombGame.exe"
          Copy-Item src-tauri\bundle-assets "$dir\bundle-assets" -Recurse
          Set-Content -Path "$dir\使用说明.txt" -Encoding UTF8 -Value @"
          保持沟通就没人爆炸 —— 免安装版
          1. 先解压（不要在压缩包里直接双击）。
          2. 双击 BombGame.exe，会先显示"正在启动"，然后打开游戏窗口。
          3. 大厅里有邀请二维码，朋友扫码/点链接加入；异地玩就用 node tools/share.mjs 的公网地址。
          说明：本目录里的 bundle-assets 是内置的 Node 运行时和游戏文件，别删。
          端口被占用会自动换 3211~3240，不用手动改。
          "@
          Compress-Archive -Path "$dir\*" -DestinationPath "out\BombGame_${ver}_portable.zip" -Force
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: BombGame-tauri-windows
          path: out/*
          if-no-files-found: error

      - name: 打 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
