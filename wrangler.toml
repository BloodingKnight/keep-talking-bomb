# Cloudflare Workers 部署配置（放在仓库根目录，这样 wrangler 默认就能找到它）
#
# 两种部署方式：
#   A) Cloudflare 控制台连 GitHub（Workers Builds）
#      构建命令: node tools/build-static-site.mjs
#      部署命令: npx wrangler deploy
#   B) GitHub Actions（.github/workflows/cloudflare.yml）
#      在仓库 Secrets 里配 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 即可
#
# 本地手动部署：
#   node tools/build-static-site.mjs
#   npx wrangler deploy
#
# 说明：
#  · 一个房间 = 一个 Durable Object，内部复用 server/room.js 的 Game（逻辑零改动）
#  · Durable Objects 需要 Workers 付费计划（$5/月起）；免费计划是否包含以控制台为准
#  · 新命名空间必须用 SQLite 后端（Cloudflare 已不接受 KV 后端的新建）

name = "bombgame"
main = "cloudflare/src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------- 自定义域名（国内强烈建议）
# workers.dev 这个默认域名在国内长期被封锁（Pages 的 pages.dev 往往是通的），
# 所以给国内朋友用就绑自己的域名（域名要托管在 Cloudflare，NS 指过来）：
#
#   routes = [{ pattern = "bomb.example.com", custom_domain = true }]
#
# 绑好后客户端地址就是 https://bomb.example.com/，不再走 workers.dev。
# 注意：即使绑了自有域名，大陆访问仍不保证稳定（Cloudflare 跨境线路问题），
# 只是比 workers.dev 好很多。对国内最稳的仍然是云主机 / 国内内网穿透。

# 静态客户端：先跑 node tools/build-static-site.mjs 生成 site/
[assets]
directory = "./site"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[observability]
enabled = true
